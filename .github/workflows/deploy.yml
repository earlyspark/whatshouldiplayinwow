# Builds the standalone bundle here and rsyncs it to the cPanel Node.js app.
#
# Nothing is built on the shared host: FastCloud Plus would likely run out of
# memory during `next build`, and the standalone output is self-contained.
#
# Server identity lives entirely in secrets so this file carries no hostname,
# username or path. NEXT_PUBLIC_* values that end up in the client bundle
# anyway are inline.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while one deploy is mid-rsync would interleave files on the
# server, so queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"
  NEXT_PUBLIC_SITE_URL: https://whatshouldiplayinwowforever.com
  NEXT_PUBLIC_APP_ENV: production
  # Static pages are prerendered here, and server components such as
  # GoogleAnalytics read APP_ENV while doing it. Without this, the build
  # bakes the development branch into every static page and GA never loads.
  APP_ENV: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
        # must be present here — setting them on the server has no effect.
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG: ${{ secrets.NEXT_PUBLIC_AMAZON_ASSOCIATE_TAG }}
        run: npm run build

      - name: Assemble the deployable tree
        # Standalone omits static assets and public/ by design; Passenger serves
        # them from these paths next to server.js.
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          if [ -d public ]; then cp -r public release/public; fi
          # Passenger serves files under the app's public/ straight from disk.
          # Without this copy, /_next/static goes through the Node process,
          # and when Passenger shuts down an idle process mid-transfer the
          # browser caches the truncated file for a year (Next marks these
          # immutable), breaking the page until the cache is cleared.
          mkdir -p release/public/_next
          cp -r .next/static release/public/_next/static
          mkdir -p release/tmp

      - name: Verify the OG image assets were traced
        # opengraph-image.tsx reads these via process.cwd() at module load, so a
        # missing font crashes the server at startup rather than failing one
        # route. Fail here instead of shipping a broken build.
        run: |
          test -f release/assets/crest.png || { echo "::error::assets/crest.png missing from standalone output"; exit 1; }
          for font in ebgaramond marcellus plexmono; do
            test -f "release/assets/fonts/$font.ttf" || { echo "::error::assets/fonts/$font.ttf missing"; exit 1; }
          done
          echo "OG assets present."

      - name: Verify analytics made it into the static pages
        # The failure mode is silent: the site looks perfect while GA and the
        # consent flow are missing. The root layout's client chunk only exists
        # when GoogleAnalytics rendered, so its absence means APP_ENV was wrong.
        run: |
          grep -q 'app/layout-' .next/server/app/index.html || { echo "::error::index.html has no layout chunk — GoogleAnalytics did not render at build time"; exit 1; }
          echo "Analytics present in prerendered pages."

      - name: Authorize SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the new build without deleting old files
        # The cached homepage names the previous build's hashed chunks. Keeping
        # those files until after the Cloudflare purge means that page keeps
        # working throughout the deploy.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az \
            --exclude '.env' \
            --exclude 'tmp/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            release/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Restart Passenger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/tmp' && touch '$DEPLOY_PATH/tmp/restart.txt'"

      - name: Wait for the new build to serve the homepage
        # A unique query string misses the Cloudflare cache, so this reaches the
        # origin. Next writes the build ID into the HTML, and requiring three
        # matches in a row catches a leftover process still serving the old build.
        env:
          SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
        run: |
          build_id=$(cat .next/BUILD_ID)
          matches=0
          for attempt in $(seq 1 30); do
            body=$(curl -s --max-time 10 "$SITE_URL/?deploy-check=$build_id-$attempt-$RANDOM" || true)
            if printf '%s' "$body" | grep -qF "$build_id"; then
              matches=$((matches + 1))
              if [ "$matches" -ge 3 ]; then echo "New build $build_id is live."; exit 0; fi
              continue
            fi
            matches=0
            echo "attempt $attempt: new build not served yet"
            sleep 5
          done
          echo "::error::The new build did not come up; old files were kept so the cached site keeps working."
          exit 1

      - name: Purge the Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare purge credentials are not set; the cached homepage would reference deleted chunks."
            exit 1
          fi
          response=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          printf '%s' "$response" | grep -q '"success":true' || { echo "::error::Cloudflare purge failed: $response"; exit 1; }
          echo "Cloudflare cache purged."
          # Purge takes effect within seconds; confirm the edge copy is the new build.
          build_id=$(cat .next/BUILD_ID)
          for attempt in $(seq 1 12); do
            curl -s --max-time 10 "$SITE_URL/" | grep -qF "$build_id" && { echo "Cached homepage is the new build."; exit 0; }
            sleep 5
          done
          echo "::error::Cloudflare still serves the old homepage; old files were kept so it keeps working."
          exit 1

      - name: Remove files the new build no longer uses
        # --delete keeps the server free of files dropped from the repo, but
        # .env holds the server's own configuration and tmp/ is Passenger's,
        # so both are excluded from deletion as well as from transfer.
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'tmp/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            release/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
